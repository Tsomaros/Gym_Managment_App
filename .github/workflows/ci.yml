name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway passwords for a database that lives for one job.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-superuser
      GYM_OWNER_PASSWORD: ci-owner
      GYM_APP_PASSWORD: ci-app
      GYM_SYSTEM_PASSWORD: ci-system
      DATABASE_URL: postgres://gym_app:ci-app@localhost:5432/gym_test
      DATABASE_SYSTEM_URL: postgres://gym_system:ci-system@localhost:5432/gym_test
      DATABASE_MIGRATOR_URL: postgres://gym_owner:ci-owner@localhost:5432/gym_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      WEB_ORIGIN: http://localhost:5173
      SMTP_URL: smtp://localhost:1025
      PLATFORM_ADMIN_EMAIL: admin@example.com
      PLATFORM_ADMIN_PASSWORD: ci-admin-password
      CHECKIN_SECRET: ci-only-checkin-secret-at-least-32-characters
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-s3-key
      S3_SECRET_KEY: ci-s3-secret
      S3_BUCKET: gym-files
      VAPID_PUBLIC_KEY: BCI-only-public-key-not-used-for-real-sends
      VAPID_PRIVATE_KEY: ci-only-private-key
      VAPID_SUBJECT: mailto:ci@example.com
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Service containers start before checkout, so init.sql is applied here instead of mounted.
      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 -d postgres -f docker/postgres/init.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm exec playwright install --with-deps chromium
      # The plans e2e uploads a PDF to object storage. MinIO needs a start command, which a service
      # container cannot take, so it runs as a plain container (same image as docker-compose.yml).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - run: pnpm e2e
