name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway passwords for a database that lives for one job.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-superuser
      GYM_OWNER_PASSWORD: ci-owner
      GYM_APP_PASSWORD: ci-app
      GYM_SYSTEM_PASSWORD: ci-system
      DATABASE_URL: postgres://gym_app:ci-app@localhost:5432/gym_test
      DATABASE_SYSTEM_URL: postgres://gym_system:ci-system@localhost:5432/gym_test
      DATABASE_MIGRATOR_URL: postgres://gym_owner:ci-owner@localhost:5432/gym_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      WEB_ORIGIN: http://localhost:5173
      SMTP_URL: smtp://localhost:1025
      PLATFORM_ADMIN_EMAIL: admin@example.com
      PLATFORM_ADMIN_PASSWORD: ci-admin-password
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Service containers start before checkout, so init.sql is applied here instead of mounted.
      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 -d postgres -f docker/postgres/init.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
